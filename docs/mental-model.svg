<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tertiaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Form Container (Top Level) -->
  <rect x="200" y="40" width="400" height="120" rx="8" fill="url(#primaryGradient)" filter="url(#shadow)"/>
  <text x="400" y="75" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="18" font-weight="600">Form Container</text>
  <text x="400" y="95" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" opacity="0.9">(Behavioral Contract)</text>
  
  <!-- Contract Details -->
  <rect x="210" y="105" width="380" height="45" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="220" y="120" fill="white" font-family="Inter, sans-serif" font-size="11">
    <tspan>• Form lifecycle mgmt  • Submission handling  • State exposure</tspan>
  </text>
  <text x="220" y="135" fill="white" font-family="Inter, sans-serif" font-size="11">
    <tspan>• Event coordination  • Position-based intent  • Responsive adaptation</tspan>
  </text>
  
  <!-- Arrow down -->
  <path d="M400 170 L400 190 M390 185 L400 195 L410 185" stroke="#374151" stroke-width="2" fill="none"/>
  
  <!-- Position-Based Presentation -->
  <rect x="50" y="210" width="700" height="160" rx="8" fill="url(#secondaryGradient)" filter="url(#shadow)"/>
  <text x="400" y="240" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="18" font-weight="600">Position-Based Presentation</text>
  <text x="400" y="260" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" opacity="0.9">(Implementation Determines UI)</text>
  
  <!-- Position Types -->
  <g fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1">
    <!-- Center -->
    <rect x="70" y="280" width="120" height="70" rx="4"/>
    <text x="130" y="300" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="500">center</text>
    <text x="130" y="315" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10">• Modal</text>
    <text x="130" y="328" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10">• Dialog</text>
    <text x="130" y="341" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10">• Overlay</text>
    
    <!-- Left/Right -->
    <rect x="210" y="280" width="120" height="70" rx="4"/>
    <text x="270" y="300" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="500">left/right</text>
    <text x="270" y="315" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10">• Sidebar</text>
    <text x="270" y="328" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10">• Sheet</text>
    <text x="270" y="341" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10">• Side-out</text>
    
    <!-- Top/Bottom -->
    <rect x="350" y="280" width="120" height="70" rx="4"/>
    <text x="410" y="300" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="500">top/bottom</text>
    <text x="410" y="315" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10">• Drawer</text>
    <text x="410" y="328" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10">• Slide-up</text>
    <text x="410" y="341" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10">• Push-down</text>
    
    <!-- Inline -->
    <rect x="490" y="280" width="120" height="70" rx="4"/>
    <text x="550" y="300" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="500">inline</text>
    <text x="550" y="315" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10">• Embed</text>
    <text x="550" y="328" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10">• Flow</text>
    <text x="550" y="341" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="10">• Page</text>
  </g>
  
  <!-- Arrows down -->
  <path d="M200 380 L200 410 M190 405 L200 415 L210 405" stroke="#374151" stroke-width="2" fill="none"/>
  <path d="M600 380 L600 410 M590 405 L600 415 L610 405" stroke="#374151" stroke-width="2" fill="none"/>
  
  <!-- Implementation Libraries -->
  <rect x="80" y="430" width="200" height="120" rx="8" fill="url(#tertiaryGradient)" filter="url(#shadow)"/>
  <text x="180" y="460" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600">Implementation</text>
  <text x="180" y="478" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600">Libraries</text>
  
  <rect x="90" y="490" width="180" height="50" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="100" y="505" fill="white" font-family="Inter, sans-serif" font-size="11">• ShadCN  • Material UI</text>
  <text x="100" y="518" fill="white" font-family="Inter, sans-serif" font-size="11">• Ant Design  • Custom</text>
  <text x="100" y="531" fill="white" font-family="Inter, sans-serif" font-size="11">• Chakra UI  • Mantine</text>
  
  <!-- Implementation Adaptation -->
  <rect x="520" y="430" width="200" height="120" rx="8" fill="url(#tertiaryGradient)" filter="url(#shadow)"/>
  <text x="620" y="460" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600">Implementation</text>
  <text x="620" y="478" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600">Adaptation</text>
  
  <rect x="530" y="490" width="180" height="50" rx="4" fill="rgba(255,255,255,0.2)"/>
  <text x="540" y="505" fill="white" font-family="Inter, sans-serif" font-size="11">• Responsive  • Platform</text>
  <text x="540" y="518" fill="white" font-family="Inter, sans-serif" font-size="11">• Theme  • Accessibility</text>
  <text x="540" y="531" fill="white" font-family="Inter, sans-serif" font-size="11">• Animation  • Context</text>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" fill="#374151" font-family="Inter, sans-serif" font-size="20" font-weight="700">Form-First, Presentation Agnostic</text>
</svg>