<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="initGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b5563;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="openGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dirtyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="closeAttemptGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="submittingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="successGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="errorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blockedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="800" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" fill="#111827" font-family="Inter, sans-serif" font-size="24" font-weight="700">Form Container State Flow</text>
  
  <!-- Initialize State -->
  <rect x="350" y="60" width="300" height="80" rx="8" fill="url(#initGradient)" filter="url(#shadow)"/>
  <text x="500" y="85" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600">INITIALIZE (Closed)</text>
  <text x="500" y="105" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12">open = false, isDirty = false, isSubmitting = false</text>
  
  <!-- Arrow: Initialize to Opened -->
  <path d="M500 150 L500 170" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="520" y="165" fill="#374151" font-family="Inter, sans-serif" font-size="11">onOpenChange(true)</text>
  
  <!-- Opened State -->
  <rect x="350" y="180" width="300" height="80" rx="8" fill="url(#openGradient)" filter="url(#shadow)"/>
  <text x="500" y="205" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600">OPENED</text>
  <text x="500" y="225" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12">open = true, isDirty = false, isSubmitting = false</text>
  
  <!-- Arrow: Opened to Dirty -->
  <path d="M500 270 L500 290" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="520" y="285" fill="#374151" font-family="Inter, sans-serif" font-size="11">user edits form</text>
  
  <!-- Dirty State -->
  <rect x="350" y="300" width="300" height="100" rx="8" fill="url(#dirtyGradient)" filter="url(#shadow)"/>
  <text x="500" y="325" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600">DIRTY STATE</text>
  <text x="500" y="345" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12">open = true, isDirty = true, isSubmitting = false</text>
  <text x="500" y="365" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="11">→ fires onDirtyChange(true) after debounceMs</text>
  
  <!-- Branch: Close Attempt -->
  <path d="M350 350 L250 350 L250 450 L330 450" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="180" y="345" fill="#374151" font-family="Inter, sans-serif" font-size="11">user attempts close</text>
  
  <!-- Close Attempt State -->
  <rect x="100" y="420" width="240" height="100" rx="8" fill="url(#closeAttemptGradient)" filter="url(#shadow)"/>
  <text x="220" y="445" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600">CLOSE ATTEMPT</text>
  <text x="220" y="465" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="11">→ fires onCloseStart()</text>
  <text x="220" y="480" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="11">→ if returns false: remain open</text>
  <text x="220" y="495" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="11">→ if returns true: proceed to close</text>
  
  <!-- Branch: Submit -->
  <path d="M500 410 L500 450" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="520" y="435" fill="#374151" font-family="Inter, sans-serif" font-size="11">user submits</text>
  
  <!-- Submitting State -->
  <rect x="380" y="460" width="240" height="80" rx="8" fill="url(#submittingGradient)" filter="url(#shadow)"/>
  <text x="500" y="485" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600">SUBMITTING</text>
  <text x="500" y="505" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12">open = true, isSubmitting = true</text>
  <text x="500" y="525" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="11">→ disables inputs, shows loading state</text>
  
  <!-- Submission Results -->
  <text x="500" y="570" text-anchor="middle" fill="#374151" font-family="Inter, sans-serif" font-size="12">onSubmit resolves with:</text>
  
  <!-- Success Branch -->
  <path d="M420 550 L200 580 L200 620" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="80" y="630" width="240" height="80" rx="8" fill="url(#successGradient)" filter="url(#shadow)"/>
  <text x="200" y="655" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600">SUCCESS</text>
  <text x="200" y="675" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12">status='success'</text>
  <text x="200" y="695" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="11">closeOnSuccess = true</text>
  
  <!-- Error Branch -->
  <path d="M500 550 L500 620" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="380" y="630" width="240" height="80" rx="8" fill="url(#errorGradient)" filter="url(#shadow)"/>
  <text x="500" y="655" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600">ERROR</text>
  <text x="500" y="675" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12">status='error'</text>
  <text x="500" y="695" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="11">remain open, show errors</text>
  
  <!-- Blocked Branch -->
  <path d="M580 550 L800 580 L800 620" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <rect x="680" y="630" width="240" height="80" rx="8" fill="url(#blockedGradient)" filter="url(#shadow)"/>
  <text x="800" y="655" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600">BLOCKED</text>
  <text x="800" y="675" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="12">status='blocked'</text>
  <text x="800" y="695" text-anchor="middle" fill="white" font-family="Inter, sans-serif" font-size="11">remain open, show reason</text>
  
  <!-- Final States -->
  <rect x="50" y="740" width="220" height="50" rx="6" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="1"/>
  <text x="160" y="760" text-anchor="middle" fill="#059669" font-family="Inter, sans-serif" font-size="12" font-weight="500">CLOSED (post-success)</text>
  <text x="160" y="775" text-anchor="middle" fill="#059669" font-family="Inter, sans-serif" font-size="10">fires onCloseComplete()</text>
  
  <rect x="390" y="740" width="220" height="50" rx="6" fill="#ef4444" opacity="0.1" stroke="#ef4444" stroke-width="1"/>
  <text x="500" y="760" text-anchor="middle" fill="#dc2626" font-family="Inter, sans-serif" font-size="12" font-weight="500">OPENED (error state)</text>
  <text x="500" y="775" text-anchor="middle" fill="#dc2626" font-family="Inter, sans-serif" font-size="10">isDirty remains true</text>
  
  <rect x="730" y="740" width="220" height="50" rx="6" fill="#f97316" opacity="0.1" stroke="#f97316" stroke-width="1"/>
  <text x="840" y="760" text-anchor="middle" fill="#ea580c" font-family="Inter, sans-serif" font-size="12" font-weight="500">OPENED (blocked state)</text>
  <text x="840" y="775" text-anchor="middle" fill="#ea580c" font-family="Inter, sans-serif" font-size="10">may trigger notifications</text>
  
  <!-- Final arrows -->
  <path d="M200 720 L160 740" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M500 720 L500 740" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M800 720 L840 740" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
</svg>