<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients and filters unchanged -->
    <linearGradient id="layer1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layer2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layer3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layer4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layer5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
  </defs>

  <rect width="1000" height="1000" fill="#fafafa"/>
  <text x="500" y="30" text-anchor="middle" fill="#111827" font-family="Inter, sans-serif" font-size="28" font-weight="700">At a Glance</text>

  <!-- Layer 1 -->
  <rect x="150" y="60" width="700" height="190" rx="14" fill="url(#layer1)" filter="url(#shadow)"/>
  <text x="500" y="90" text-anchor="middle" fill="white" font-size="20" font-weight="600">FORM CONTAINER</text>
  <text x="500" y="120" text-anchor="middle" fill="white" font-size="14">(Behavioral Contract Layer)</text>
  <text x="500" y="150" text-anchor="middle" fill="white" font-size="13">Unified API: position, open, onOpenChange, onSubmit</text>
  <text x="500" y="170" text-anchor="middle" fill="white" font-size="13">Lifecycle: init → open → interact → submit → process → close</text>
  <text x="500" y="190" text-anchor="middle" fill="white" font-size="13">State: isSubmitting, isDirty</text>
  <text x="500" y="210" text-anchor="middle" fill="white" font-size="13">Config: closeOnSuccess, resetOnClose, preventCloseWhenDirty</text>
  <text x="500" y="230" text-anchor="middle" fill="white" font-size="13">Events: onDirtyChange, onClose</text>

  <!-- Arrow 1 -->
  <path d="M500 260 L500 280" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Layer 2 -->
  <rect x="150" y="290" width="700" height="140" rx="14" fill="url(#layer2)" filter="url(#shadow)"/>
  <text x="500" y="320" text-anchor="middle" fill="white" font-size="18" font-weight="600">POSITION-BASED PRESENTATION</text>
  <text x="500" y="350" text-anchor="middle" fill="white" font-size="13">center → Modal Dialog (ARIA modal dialog)</text>
  <text x="500" y="370" text-anchor="middle" fill="white" font-size="13">left/right → Sidebar (ARIA dialog)</text>
  <text x="500" y="390" text-anchor="middle" fill="white" font-size="13">top/bottom → Drawer (ARIA modal dialog)</text>
  <text x="500" y="410" text-anchor="middle" fill="white" font-size="13">inline → Inline Form (ARIA form landmark)</text>

  <!-- Arrow 2 -->
  <path d="M500 440 L500 460" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Layer 3 -->
  <rect x="150" y="470" width="700" height="140" rx="14" fill="url(#layer3)" filter="url(#shadow)"/>
  <text x="500" y="500" text-anchor="middle" fill="white" font-size="18" font-weight="600">SLOT CONTRACTS</text>
  <text x="500" y="530" text-anchor="middle" fill="white" font-size="13">header → role="heading", labelled container</text>
  <text x="500" y="550" text-anchor="middle" fill="white" font-size="13">body → role="region", contains form fields</text>
  <text x="500" y="570" text-anchor="middle" fill="white" font-size="13">footer → role="contentinfo", primary + secondary actions</text>
  <text x="500" y="590" text-anchor="middle" fill="white" font-size="13">notifications → role="status"/"alert", live region for updates</text>

  <!-- Arrow 3 -->
  <path d="M500 620 L500 640" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Layer 4 -->
  <rect x="150" y="650" width="700" height="110" rx="14" fill="url(#layer4)" filter="url(#shadow)"/>
  <text x="500" y="680" text-anchor="middle" fill="white" font-size="18" font-weight="600">ACCESSIBILITY MAPPING</text>
  <text x="500" y="705" text-anchor="middle" fill="white" font-size="13">Modal positions: aria-modal="true", focus trap, ESC close</text>
  <text x="500" y="725" text-anchor="middle" fill="white" font-size="13">Non-modal sidebars: labelled, dismissible</text>
  <text x="500" y="745" text-anchor="middle" fill="white" font-size="13">Inline: natural reading order, no trap</text>
  <text x="500" y="765" text-anchor="middle" fill="white" font-size="13">Notifications: aria-live="polite"/"assertive" as appropriate</text>

  <!-- Layer 4: ACCESSIBILITY MAPPING -->
  <rect x="150" y="650" width="700" height="140" rx="14" fill="url(#layer4)" filter="url(#shadow)"/>
  <text x="500" y="680" text-anchor="middle" fill="white" font-size="18" font-weight="600">ACCESSIBILITY MAPPING</text>
  <text x="500" y="705" text-anchor="middle" fill="white" font-size="13">Modal positions: aria-modal="true", focus trap, ESC close</text>
  <text x="500" y="725" text-anchor="middle" fill="white" font-size="13">Non-modal sidebars: labelled, dismissible</text>
  <text x="500" y="745" text-anchor="middle" fill="white" font-size="13">Inline: natural reading order, no trap</text>
  <text x="500" y="765" text-anchor="middle" fill="white" font-size="13">Notifications: aria-live="polite"/"assertive" as appropriate</text>

   <!-- Arrow 4 -->
   <path d="M500 800 L500 820" stroke="#374151" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

   <!-- Layer 5: RESPONSIVE ADAPTATION -->
   <rect x="150" y="830" width="700" height="100" rx="14" fill="url(#layer5)" filter="url(#shadow)"/>
   <text x="500" y="860" text-anchor="middle" fill="white" font-size="18" font-weight="600">RESPONSIVE ADAPTATION</text>
   <text x="500" y="885" text-anchor="middle" fill="white" font-size="13">Position can change with viewport, form behavior stays same</text>
   <text x="500" y="905" text-anchor="middle" fill="white" font-size="13">e.g. right → bottom on mobile</text>

</svg>